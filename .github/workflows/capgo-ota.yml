name: Capgo OTA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Capgo channel (internal, beta, or production)'
        required: true
        type: choice
        options: [internal, beta, production]
      bundle:
        description: 'Unique semantic bundle version (for example 0.2.2+web.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify:
    name: classify native compatibility
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.release-type.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Capgo credentials
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
          CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
        run: |
          test -n "$CAPGO_API_KEY" || { echo "::error::CAPGO_API_KEY is required"; exit 1; }
          test -n "$CAPGO_PRIVATE_KEY" || { echo "::error::CAPGO_PRIVATE_KEY is required"; exit 1; }

      - name: Determine release type
        id: release-type
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
        run: |
          TYPE="$(bunx capgo bundle releaseType com.practocore.app --channel '${{ inputs.channel }}' --apikey "$CAPGO_API_KEY" --text)"
          test "$TYPE" = OTA || { echo "::error::Native-incompatible change detected ($TYPE). Ship a store release and establish its Capgo baseline first."; exit 1; }
          echo "value=$TYPE" >> "$GITHUB_OUTPUT"

  upload:
    name: build and upload guarded OTA
    needs: classify
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run generate

      - name: Stage frontend into dist/
        run: |
          if [ -f .output/public/index.html ]; then
            rm -rf dist && cp -R .output/public dist
          fi
          test -f dist/index.html

      - name: Verify release packaging
        run: bun run release:verify

      - name: Verify compatibility and upload signed bundle
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
          CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
        run: |
          bunx capgo bundle compatibility com.practocore.app --channel '${{ inputs.channel }}' --apikey "$CAPGO_API_KEY" --text
          bunx capgo bundle upload com.practocore.app --path ./dist --channel '${{ inputs.channel }}' --bundle '${{ inputs.bundle }}' --apikey "$CAPGO_API_KEY" --key-data-v2 "$CAPGO_PRIVATE_KEY" --fail-on-incompatible --auto-min-update-version
